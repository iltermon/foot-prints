name: Release

# Push a tag that matches manifest.json's version (e.g. 1.0.0, no leading "v")
# to build the plugin and publish a GitHub release with main.js, manifest.json
# and styles.css attached. BRAT and the community catalog install from these.

on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "npm"

            - name: Check tag matches manifest version
              run: |
                  version=$(node -p "require('./manifest.json').version")
                  if [ "$version" != "$GITHUB_REF_NAME" ]; then
                    echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
                    exit 1
                  fi

            - run: npm ci
            - run: npm run build

            - name: Publish release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  prerelease=""
                  case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
                  gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
                    --title "$GITHUB_REF_NAME" --generate-notes $prerelease
